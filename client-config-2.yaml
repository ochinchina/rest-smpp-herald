connections:
  - address: "127.0.0.1:2775"
    system_id: "system_id"
    password: "password"
    system_type: "system_type"
    addr_ton: 0
    addr_npi: 0
    address_range: "^123"
    interface_version: 52
    weight: 1
max_inbound_messages: 10000
session_init_timer: 30
enquire_link_timer: 60
inactive_timer: 120
response_timer: 30
rest_addresses:
  - address: "127.0.0.1:8081"
request_handlers:
  - urls:
      - "http://127.0.0.1:8889/handle"
    algorithm: "round_robin"
